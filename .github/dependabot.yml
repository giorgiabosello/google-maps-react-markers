version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Conventional Commits with the emoji after the type, like scripts/commit-emoji.mjs.
    commit-message:
      prefix: 'build(deps): ⬆️'
      prefix-development: 'build(deps-dev): ⬆️'
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      docs:
        patterns: ['fumadocs-*', 'next', 'tailwindcss', '@tailwindcss/*', 'lucide-react']
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # The types follow the Node.js version in .nvmrc: bump the major together with it.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci(deps): ⬆️'
    groups:
      actions:
        patterns: ['*']
