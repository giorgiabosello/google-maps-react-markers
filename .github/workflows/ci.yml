name: CI

on:
  pull_request:
  push:
    branches: [master, v3]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        if: matrix.node == 24
        run: pnpm lint && pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the published package (publint, attw)
        run: pnpm check:package
      - name: Bundle size
        run: pnpm size

  docs:
    name: Build the docs site (static export with SSR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm --filter example-vite build
