name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version pull request or publish to npm
    runs-on: ubuntu-latest
    # Only main may deploy to this environment, and npm trusts only this environment.
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC): no NPM_TOKEN, provenance included.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build, lint, typecheck and test before publishing
        run: pnpm build && pnpm lint && pnpm typecheck && pnpm test
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true
      # Changesets names the release after the tag (name@version): keep only the version.
      - name: Name the GitHub release after the version
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.changesets.outputs['published-packages'] }}
        run: |
          echo "$PUBLISHED" | jq -r '.[] | "\(.name)@\(.version) \(.version)"' | while read -r tag version; do
            gh release edit "$tag" --title "$version"
          done
