name: CI (v2)

on:
  pull_request:
    branches: [v2]
  push:
    branches: [v2]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: yarn lint
      - name: Type-check
        run: yarn type-check
      - name: Build
        run: yarn tsup
      # dist is committed and published as it is: it must match the sources.
      - name: Check that dist is up to date
        run: git diff --exit-code -- dist
